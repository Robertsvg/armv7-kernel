name: Checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Formatting and patch hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned formatter
        run: python -m pip install --disable-pip-version-check clang-format==22.1.8

      - name: Check maintained C and header formatting
        run: git ls-files -z -- '*.c' '*.h' | xargs -0 clang-format --dry-run --Werror --style=file

      - name: Check latest patch whitespace
        run: git log -1 --format= --check
